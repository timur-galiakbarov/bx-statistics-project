name: Deploy production

on:
  push:
    branches: [main]

concurrency:
  group: socstat-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/socstat' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Upload application
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.idea/' \
            --exclude 'legacy/' \
            --exclude 'node_modules/' \
            --exclude 'dist/' \
            --exclude 'api/dist/' \
            --exclude 'api/.env' \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Restart services and check health
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" << EOF
            set -eu
            cd "$DEPLOY_PATH"
            if [ ! -f api/.env ]; then
              cp deploy/api.env.production.example api/.env
              chmod 600 api/.env
              echo "Created api/.env from the production template. Fill its secrets, then rerun the workflow."
              exit 1
            fi
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            for attempt in 1 2 3 4 5 6; do
              curl --fail --silent --show-error http://127.0.0.1:4000/api/health && exit 0
              sleep 5
            done
            exit 1
          EOF
