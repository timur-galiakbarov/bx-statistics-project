<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Socstat.ru эволюционирует</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #17212b; background: radial-gradient(circle at 50% 25%, #e8f5e9, #f8fbf8 48%, #fff); font-family: system-ui, -apple-system, sans-serif; }
    main { max-width: 520px; text-align: center; }
    .mark { display: flex; align-items: end; justify-content: center; gap: 9px; height: 90px; margin-bottom: 34px; }
    .mark span { width: 20px; border-radius: 10px; background: #2b8a3e; animation: grow 1.4s ease-in-out infinite alternate; transform-origin: bottom; }
    .mark span:nth-child(1) { height: 34px; animation-delay: -.8s; opacity: .55; }
    .mark span:nth-child(2) { height: 58px; animation-delay: -.4s; opacity: .75; }
    .mark span:nth-child(3) { height: 82px; }
    h1 { margin: 0 0 16px; font-size: clamp(30px, 6vw, 46px); line-height: 1.15; letter-spacing: -.035em; }
    h1 span { color: #2b8a3e; }
    p { margin: 0; color: #5b6875; font-size: 17px; line-height: 1.6; }
    .status { margin-top: 30px; font-size: 14px; }
    @keyframes grow { from { transform: scaleY(.55); } to { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) { .mark span { animation: none; } }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"><span></span><span></span><span></span></div>
    <h1><span>Socstat.ru</span> эволюционирует</h1>
    <p>Немного обновляемся. Скоро всё снова заработает.</p>
    <p class="status">Страница обновится автоматически</p>
  </main>
  <script>
    async function checkAvailability() {
      try {
        const response = await fetch('/api/health', { cache: 'no-store' });
        if (response.ok) { window.location.reload(); return; }
      } catch (_) { /* Следующая проверка через несколько секунд. */ }
      setTimeout(checkAvailability, 5000);
    }
    setTimeout(checkAvailability, 5000);
  </script>
</body>
</html>
