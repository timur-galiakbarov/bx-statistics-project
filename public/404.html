<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Страница не найдена — Socstat</title>
    <style>
      :root { color: #3c4858; font-family: Arial, sans-serif; }
      * { box-sizing: border-box; }
      body { align-items: center; background: #f5f7f6; display: flex; justify-content: center; margin: 0; min-height: 100vh; padding: 24px; }
      main { max-width: 440px; text-align: center; }
      .icon { align-items: center; background: #e9f7eb; border-radius: 50%; color: #287d30; display: flex; font-size: 32px; height: 76px; justify-content: center; margin: 0 auto 20px; width: 76px; }
      .code { color: #4caf50; font-size: 14px; font-weight: 700; letter-spacing: .12em; }
      h1 { font-size: 30px; font-weight: 400; margin: 9px 0; }
      p { color: #687684; line-height: 1.5; margin: 0; }
      a { background: #4caf50; border-radius: 4px; box-shadow: 0 2px 5px #4caf5059; color: #fff; display: inline-block; font-weight: 700; margin-top: 26px; padding: 12px 20px; text-decoration: none; }
      a:hover { background: #388e3c; }
    </style>
  </head>
  <body>
    <main>
      <div class="icon">⌕</div>
      <div class="code">404</div>
      <h1>Страница не найдена</h1>
      <p>Возможно, адрес изменился или был введён с ошибкой.</p>
      <a href="/">На главную</a>
    </main>
  </body>
</html>
