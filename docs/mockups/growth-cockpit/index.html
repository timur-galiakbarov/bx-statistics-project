<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Socstat — growth-cockpit · интерактивный макет</title>
<style>
  :root{
    --bg:#eef1ee; --panel:#fff; --ink:#20332f; --text:#334155; --muted:#6b7770; --muted-2:#8b978f;
    --line:#e0e6e1; --line-soft:#edf1ee;
    --green:#21815f; --green-dark:#1a6a4d; --green-soft:#eaf4ee; --green-line:#cfe4d8;
    --vk:#0077ff; --tg:#2aabee; --mp:#6b5bd2; --mp-soft:#f1efff;
    --amber:#b7791f; --amber-soft:#fff4df; --blue:#2563eb; --blue-soft:#e8f0ff;
    --red:#b42318; --red-soft:#fff0ef;
    --shadow:0 10px 30px rgba(35,71,44,.06);
    font-family:Roboto,"Helvetica Neue",Arial,sans-serif;
    color:var(--text);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);min-height:100vh}
  button,input,select,textarea{font:inherit}
  button{cursor:pointer}
  a{color:inherit}
  .app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
  /* sidebar */
  .sidebar{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;height:100vh;padding:16px 13px 14px;position:sticky;top:0;overflow:auto}
  .brand{display:flex;align-items:center;gap:10px;padding:2px 6px 15px;border-bottom:1px solid var(--line-soft)}
  .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(140deg,#2a9d74,#186a4c);color:#fff;display:grid;place-items:center;font-weight:700;font-size:17px;box-shadow:0 6px 14px -6px rgba(33,129,95,.5)}
  .brand-name{font-size:15px;font-weight:700;letter-spacing:-.2px;color:var(--ink)}
  .brand-sub{font-size:11px;color:var(--muted)}
  .project-wrap{position:relative;margin-top:14px}
  .project-btn{width:100%;display:flex;align-items:center;gap:9px;background:#f7faf8;border:1px solid var(--line);border-radius:11px;padding:9px 10px;text-align:left}
  .project-btn:hover{background:#f1f7f3}
  .project-avatar{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;flex:none}
  .project-meta{display:grid;gap:1px;min-width:0}
  .project-meta strong{font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .project-meta small{font-size:10.5px;color:var(--muted)}
  .project-btn .chev{margin-left:auto;color:var(--muted-2);flex:none}
  .project-menu{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px rgba(20,40,30,.14);padding:5px;z-index:20}
  .project-option{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;padding:8px;border-radius:8px;text-align:left}
  .project-option:hover{background:#f5f8f6}
  .project-option .project-avatar{width:26px;height:26px;border-radius:7px;font-size:10px}
  .project-option span{display:grid;gap:1px}
  .project-option strong{font-size:12px;color:var(--ink)}
  .project-option small{font-size:10px;color:var(--muted)}
  .nav{display:grid;gap:2px;margin-top:14px}
  .nav button{display:flex;align-items:center;gap:10px;border:0;background:none;border-radius:9px;padding:9px 10px;color:var(--text);font-size:13px;text-align:left;min-height:38px}
  .nav button:hover{background:#f5f8f6}
  .nav button.active{background:var(--green-soft);color:var(--green-dark);font-weight:600}
  .nav .nav-icon{color:#93a29a;display:flex;flex:none}
  .nav button.active .nav-icon{color:var(--green)}
  .nav-badge{margin-left:auto;background:#eef2ef;color:#5d6b63;border-radius:999px;font-size:10px;padding:1px 7px;font-weight:600}
  .nav button.active .nav-badge{background:#d5e9dd;color:var(--green-dark)}
  .side-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line-soft)}
  .side-user{display:flex;align-items:center;gap:9px;padding:6px}
  .side-user .avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(145deg,#dfeee2,#c8e2cd);color:#2f6c38;display:grid;place-items:center;font-size:11px;font-weight:700}
  .side-user span{display:grid;gap:1px}
  .side-user strong{font-size:12px;color:var(--ink)}
  .side-user small{font-size:10px;color:var(--muted)}
  /* main */
  .main{min-width:0}
  .topbar{height:60px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 26px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.72);backdrop-filter:blur(8px);position:sticky;top:0;z-index:10}
  .topbar-left{display:flex;align-items:center;gap:10px;min-width:0}
  .crumb{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .crumb b{color:var(--ink);font-weight:600}
  .demo-pill{display:inline-flex;align-items:center;gap:6px;background:var(--amber-soft);color:#8a5a00;border:1px solid #f2dfb6;border-radius:999px;font-size:10.5px;font-weight:600;padding:3px 9px;white-space:nowrap}
  .demo-dot{width:6px;height:6px;border-radius:50%;background:#d79a2b}
  .topbar-right{display:flex;align-items:center;gap:10px}
  .date-chip{font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 10px;white-space:nowrap}
  .avatar-sm{width:30px;height:30px;border-radius:50%;background:linear-gradient(145deg,#dfeee2,#c8e2cd);color:#2f6c38;display:grid;place-items:center;font-size:11px;font-weight:700}
  .view{max-width:1280px;margin:0 auto;padding:24px 26px 52px}
  /* page head */
  .page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:22px;margin-bottom:18px}
  .eyebrow{display:block;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--green-dark);margin-bottom:6px}
  h1{margin:0;font-size:27px;line-height:1.18;letter-spacing:-.6px;color:var(--ink);font-weight:600}
  .sub{margin:7px 0 0;color:var(--muted);font-size:13.5px;line-height:1.55;max-width:760px}
  .head-actions{display:flex;gap:8px;align-items:center;flex:none;padding-top:4px}
  /* buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:9px;padding:9px 13px;font-size:13px;font-weight:500;border:1px solid transparent;min-height:36px;white-space:nowrap}
  .btn.primary{background:var(--green);border-color:var(--green);color:#fff}
  .btn.primary:hover{background:var(--green-dark)}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--text)}
  .btn.ghost:hover{background:#f7faf8}
  .btn.soft{background:var(--green-soft);border-color:var(--green-line);color:var(--green-dark)}
  .btn.soft:hover{background:#e0f0e7}
  .btn.small{padding:6px 10px;font-size:12px;min-height:30px;border-radius:8px}
  .btn:disabled{opacity:.55;cursor:default}
  /* cards */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:18px 20px;box-shadow:var(--shadow)}
  .card h3{margin:0;font-size:15px;color:var(--ink);font-weight:600}
  .card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}
  .card-head .hint{font-size:11.5px;color:var(--muted)}
  .grid{display:grid;gap:14px}
  .two-col{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px}
  .three-col{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  /* hero */
  .hero{border:1px solid var(--green-line);border-radius:16px;background:radial-gradient(circle at 92% 0%,rgba(191,227,198,.5),transparent 38%),linear-gradient(135deg,#fbfdfb,#f2f9f4);padding:20px 22px;display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:20px;align-items:center;margin-bottom:14px}
  .hero h2{margin:0;font-size:21px;letter-spacing:-.35px;color:var(--ink);font-weight:600}
  .hero p{margin:7px 0 0;color:#5f7068;font-size:13px;line-height:1.5}
  .hero-side{background:rgba(255,255,255,.8);border:1px solid #dcebe1;border-radius:13px;padding:13px 15px}
  .hero-side small{display:block;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;font-weight:700}
  .hero-side strong{display:block;font-size:24px;color:var(--ink);letter-spacing:-.5px;margin:3px 0 1px}
  .hero-side span{font-size:11.5px;color:var(--muted)}
  .hero-side a{display:inline-block;margin-top:8px;font-size:12px;color:var(--green-dark);text-decoration:none;font-weight:600}
  .hero-side a:hover{text-decoration:underline}
  /* loop */
  .loop-wrap{margin:4px 0 16px}
  .loop-label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2);margin:0 0 9px}
  .loop{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:26px}
  .loop-step{position:relative;background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 14px;text-align:left;min-height:98px;display:flex;flex-direction:column;gap:4px}
  .loop-step:hover{border-color:#c9ded2;box-shadow:var(--shadow)}
  .loop-step:not(:last-child)::after{content:"→";position:absolute;right:-20px;top:50%;transform:translateY(-50%);color:#b7c4bc;font-size:15px}
  .loop-step .num{position:absolute;top:11px;right:12px;font-size:10px;color:#aab6ae;font-weight:700}
  .loop-step .loop-icon{color:var(--green);display:flex;margin-bottom:3px}
  .loop-step strong{font-size:12.5px;color:var(--ink)}
  .loop-step small{font-size:10.5px;color:var(--muted);line-height:1.35}
  .loop-note{margin:9px 0 0;font-size:11.5px;color:var(--muted)}
  .loop-note a{color:var(--green-dark);font-weight:600;text-decoration:none}
  /* kpi */
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .kpi small{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted-2);font-weight:700}
  .kpi strong{display:block;font-size:26px;letter-spacing:-.7px;color:var(--ink);margin:4px 0 2px;font-weight:600}
  .kpi span{font-size:11.5px;color:var(--muted)}
  .delta{color:var(--green-dark);font-weight:600}
  /* tasks */
  .task{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line-soft)}
  .task:first-of-type{border-top:0;padding-top:2px}
  .task-icon{width:30px;height:30px;border-radius:9px;background:var(--green-soft);color:var(--green-dark);display:grid;place-items:center;flex:none}
  .task-main{min-width:0;flex:1}
  .task-main strong{display:block;font-size:12.5px;color:var(--ink);line-height:1.35}
  .task-main p{margin:3px 0 0;font-size:11.5px;color:var(--muted);line-height:1.4}
  .task-action{flex:none}
  /* table */
  table{width:100%;border-collapse:collapse}
  th{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted-2);font-weight:700;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
  td{font-size:12.5px;padding:9px 8px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
  tr:last-child td{border-bottom:0}
  .num-cell{text-align:right;white-space:nowrap}
  th.num-cell{text-align:right}
  .pos{color:var(--green-dark);font-weight:600}
  .muted{color:var(--muted)}
  /* pills */
  .pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:10.5px;font-weight:600;white-space:nowrap}
  .pill.st-idea{background:#f1f4f6;color:#6b7785}
  .pill.st-draft{background:var(--amber-soft);color:var(--amber)}
  .pill.st-scheduled{background:var(--blue-soft);color:var(--blue)}
  .pill.st-published{background:#e6f4ec;color:var(--green-dark)}
  .pill.st-failed{background:var(--red-soft);color:var(--red)}
  .plat{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--muted);white-space:nowrap}
  .plat i{width:7px;height:7px;border-radius:50%;display:inline-block}
  .plat i.vk{background:var(--vk)}
  .plat i.tg{background:var(--tg)}
  .plat b{font-weight:600;color:#4e5d55}
  /* upcoming */
  .upcoming{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .up{display:flex;gap:10px;align-items:flex-start;background:#fbfcfb;border:1px solid var(--line-soft);border-radius:11px;padding:11px 12px}
  .up-date{width:38px;flex:none;text-align:center;background:#fff;border:1px solid var(--line);border-radius:9px;padding:4px 0}
  .up-date strong{display:block;font-size:15px;color:var(--ink);line-height:1.1}
  .up-date small{font-size:9.5px;color:var(--muted);text-transform:uppercase}
  .up-main{min-width:0;display:grid;gap:3px}
  .up-main strong{font-size:12px;color:var(--ink);line-height:1.35;font-weight:600}
  .up-main .meta{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--muted)}
  /* calendar */
  .cal-toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:12px}
  .cal-nav{display:flex;align-items:center;gap:7px}
  .cal-title{font-size:17px;font-weight:600;color:var(--ink);min-width:150px;letter-spacing:-.2px}
  .icon-btn{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--muted)}
  .icon-btn:hover{background:#f7faf8;color:var(--ink)}
  .seg{display:flex;background:#e7ebe8;border-radius:9px;padding:3px;gap:2px}
  .seg button{border:0;background:none;border-radius:7px;padding:5px 11px;font-size:11.5px;color:#66746c}
  .seg button.active{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .filters{display:flex;gap:6px;flex-wrap:wrap}
  .chip-filter{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px;font-size:11px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
  .chip-filter.active{border-color:#bcd9c8;background:var(--green-soft);color:var(--green-dark);font-weight:600}
  .chip-filter i{width:7px;height:7px;border-radius:50%}
  .cal-legend{display:flex;gap:11px;align-items:center;font-size:10.5px;color:var(--muted);flex-wrap:wrap}
  .cal-legend span{display:inline-flex;align-items:center;gap:5px}
  .cal-legend i{width:8px;height:8px;border-radius:2px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;box-shadow:var(--shadow)}
  .cal-dow{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted-2);font-weight:700;padding:9px 9px;background:#fafcfb;border-bottom:1px solid var(--line)}
  .cal-day{min-height:128px;border-right:1px solid var(--line-soft);border-top:1px solid var(--line-soft);padding:6px 7px 7px;display:flex;flex-direction:column;gap:4px;position:relative;min-width:0}
  .cal-day:nth-child(7n){border-right:0}
  .cal-day.weekend{background:#fafbfa}
  .cal-day.other{background:#f7f8f7}
  .cal-day.other .cal-num{color:#c3cac5}
  .cal-day.today{background:#f4faf6;box-shadow:inset 0 0 0 2px #bfe0cd}
  .cal-num{font-size:11.5px;color:var(--muted);font-weight:600;width:22px;height:22px;display:grid;place-items:center;flex:none}
  .cal-day.today .cal-num{background:var(--green);color:#fff;border-radius:50%}
  .cal-chip{border:0;border-left:3px solid #aab6ae;background:#f3f6f4;border-radius:5px;padding:4px 5px;font-size:10.5px;line-height:1.2;color:#3f4d46;text-align:left;display:flex;align-items:flex-start;gap:4px;min-width:0;overflow:hidden}
  .cal-chip:hover{filter:brightness(.97)}
  .cal-chip .ct{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.2}
  .cal-chip .dot{width:5px;height:5px;border-radius:50%;flex:none}
  .cal-chip .dot.vk{background:var(--vk)}
  .cal-chip .dot.tg{background:var(--tg)}
  .cal-chip.st-idea{border-left-color:#95a1ab;background:#f3f6f8}
  .cal-chip.st-draft{border-left-color:#d9a441;background:#fff7e8}
  .cal-chip.st-scheduled{border-left-color:#5b8def;background:#edf3ff}
  .cal-chip.st-published{border-left-color:#3fa87b;background:#eaf6f0}
  .cal-more{border:0;background:none;color:var(--muted);font-size:10px;padding:1px 3px;text-align:left}
  .cal-more:hover{color:var(--green-dark)}
  .cal-grid.week .cal-day{min-height:290px}
  .cal-grid.week .cal-chip{font-size:11.5px;padding:5px 6px}
  .cal-hint{font-size:11.5px;color:var(--muted);margin:9px 0 0}
  /* competitors */
  .comp-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin-bottom:14px}
  .comp-card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 14px;display:grid;gap:8px}
  .comp-top{display:flex;align-items:center;gap:9px;min-width:0}
  .comp-logo{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none}
  .comp-top strong{font-size:12px;color:var(--ink);line-height:1.3;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .comp-top small{font-size:10px;color:var(--muted)}
  .comp-stats{display:flex;gap:12px;font-size:10.5px;color:var(--muted);border-top:1px solid var(--line-soft);padding-top:8px}
  .comp-stats b{display:block;font-size:12px;color:var(--ink);font-weight:600}
  .feed{display:grid;gap:9px}
  .feed-item{display:flex;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;align-items:flex-start}
  .feed-main{min-width:0;flex:1}
  .feed-meta{display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--muted);flex-wrap:wrap}
  .feed-meta strong{color:var(--ink);font-size:11.5px}
  .feed-text{margin:5px 0 0;font-size:12.5px;color:#46544c;line-height:1.45}
  .feed-side{flex:none;display:grid;gap:6px;justify-items:end}
  .mult{display:inline-flex;align-items:center;gap:4px;background:#eaf6f0;color:var(--green-dark);border:1px solid #cfe8da;border-radius:999px;padding:3px 8px;font-size:10.5px;font-weight:700}
  .feed-side small{font-size:10.5px;color:var(--muted)}
  /* ideas */
  .tabs{display:flex;gap:4px;background:#e7ebe8;padding:4px;border-radius:10px;width:max-content}
  .tabs button{border:0;background:none;border-radius:7px;padding:7px 13px;font-size:12px;color:#66746c}
  .tabs button.active{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .idea-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin-top:14px}
  .idea{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 17px;display:flex;flex-direction:column;gap:10px}
  .idea-src{font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .idea h3{margin:0;font-size:15.5px;color:var(--ink);letter-spacing:-.2px}
  .angle{border-left:3px solid #8cc4a5;background:#f5faf7;border-radius:0 7px 7px 0;padding:9px 11px;font-size:12px;color:#3d5248;line-height:1.45}
  .why{font-size:11.5px;color:var(--muted);line-height:1.45;margin:0}
  .why b{color:#4e5d55}
  .idea-foot{display:flex;gap:7px;margin-top:auto;padding-top:4px;flex-wrap:wrap}
  /* draft */
  .draft-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
  .draft-card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px 20px;box-shadow:var(--shadow)}
  .ch-tabs{display:flex;gap:5px;margin-bottom:14px;flex-wrap:wrap}
  .ch-tab{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:11.5px;color:var(--muted)}
  .ch-tab.active{border-color:#bcd9c8;background:var(--green-soft);color:var(--green-dark);font-weight:600}
  .ch-tab i{width:7px;height:7px;border-radius:50%}
  .ch-tab i.vk{background:var(--vk)}
  .ch-tab i.tg{background:var(--tg)}

  /* ---------- calendar ---------- */
  function planChips(dateStr){
    const items = cur().plan.filter(function(i){ return i.date===dateStr && (state.channelFilter==='all' || i.ch===state.channelFilter); });
    return items;
  }
  function chipHtml(i){
    const c = chById(i.ch);
    const t = state.calView==='week' && i.status!=='idea' ? i.time+' · ' : '';
    return '<button class="cal-chip st-'+i.status+'" data-item="'+i.id+'" title="'+i.title+'"><span class="dot '+c.platform+'"></span><span class="ct">'+t+i.title+'</span></button>';
  }
  function monthGrid(){
    const y=state.month.getFullYear(), m=state.month.getMonth();
    const first=new Date(y,m,1);
    const offset=(first.getDay()+6)%7;
    const days=new Date(y,m+1,0).getDate();
    const rows=Math.max(5, Math.ceil((offset+days)/7));
    const cells=[];
    for(let i=0;i<rows*7;i++){
      const dayNum=i-offset+1;
      const d=new Date(y,m,dayNum);
      const inMonth=dayNum>=1 && dayNum<=days;
      const dIso=iso(d);
      cells.push({d:d, inMonth:inMonth, iso:dIso});
    }
    return cells;
  }
  function weekGrid(){
    const cells=[];
    for(let i=0;i<7;i++){
      const d=new Date(state.weekStart.getFullYear(),state.weekStart.getMonth(),state.weekStart.getDate()+i);
      cells.push({d:d, inMonth:true, iso:iso(d)});
    }
    return cells;
  }
  function screenPlan(){
    const p=cur();
    const isWeek = state.calView==='week';
    const cells = isWeek ? weekGrid() : monthGrid();
    const title = isWeek
      ? (function(){ const a=cells[0].d, b=cells[6].d; return a.getDate()+'–'+b.getDate()+' '+MONTHS_GEN[b.getMonth()]; })()
      : MONTHS[state.month.getMonth()]+' '+state.month.getFullYear();
    const filters = '<button class="chip-filter '+(state.channelFilter==='all'?'active':'')+'" data-channel="all">Все каналы</button>'+
      p.channels.map(function(c){ return '<button class="chip-filter '+(state.channelFilter===c.id?'active':'')+'" data-channel="'+c.id+'"><i style="background:'+(c.platform==='vk'?'#0077ff':'#2aabee')+'"></i>'+c.name+'</button>'; }).join('');
    return '<div class="page-head"><div><span class="eyebrow">'+p.name+'</span><h1>Контент-план</h1><p class="sub">Что и когда выходит в каждом канале. Нажмите на публикацию, чтобы открыть карточку.</p></div>'+
      '<div class="head-actions"><button class="btn ghost" data-action="schedule">'+icon('plus',15)+' Запланировать</button></div></div>'+
      '<div class="cal-toolbar"><div class="cal-nav">'+
        '<button class="icon-btn" data-cal="prev" aria-label="Назад">'+icon('chevL',15)+'</button>'+
        '<span class="cal-title">'+title+'</span>'+
        '<button class="icon-btn" data-cal="next" aria-label="Вперёд">'+icon('chevR',15)+'</button>'+
        '<button class="btn small ghost" data-cal="today">Сегодня</button>'+
      '</div><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">'+
        '<div class="seg"><button class="'+(isWeek?'':'active')+'" data-calview="month">Месяц</button><button class="'+(isWeek?'active':'')+'" data-calview="week">Неделя</button></div>'+
        '<div class="filters">'+filters+'</div>'+
      '</div></div>'+
      '<div class="cal-legend" style="margin-bottom:8px"><span><i style="background:#95a1ab"></i>Идея</span><span><i style="background:#d9a441"></i>Черновик</span><span><i style="background:#5b8def"></i>Запланировано</span><span><i style="background:#3fa87b"></i>Вышло</span></div>'+
      '<div class="cal-grid '+(isWeek?'week':'')+'">'+
        DOW.map(function(x){return '<div class="cal-dow">'+x+'</div>';}).join('')+
        cells.map(function(cell){
          const items=planChips(cell.iso);
          const isToday=cell.iso===todayIso();
          const wd=(cell.d.getDay()+6)%7;
          const show=isWeek?items:items.slice(0,3);
          return '<div class="cal-day '+(cell.inMonth?'':'other')+' '+(wd>=5?'weekend':'')+' '+(isToday?'today':'')+'">'+
            '<span class="cal-num">'+cell.d.getDate()+'</span>'+
            show.map(chipHtml).join('')+
            (!isWeek && items.length>3 ? '<button class="cal-more" data-day="'+cell.iso+'">+ещё '+(items.length-3)+'</button>' : '')+
            (isWeek && items.length===0 ? '<span class="hint" style="font-size:10.5px">—</span>' : '')+
          '</div>';
        }).join('')+
      '</div><p class="cal-hint">Подсказка: чип — карточка публикации; «+ещё» — все публикации дня. В демо можно перенести месяц и переключить вид.</p>';
  }

    if(!next) return 'Не запланировано';
    const d=parseIso(next.date);
    const ch=chById(next.ch);
    return d.getDate()+' '+MONTHS_GEN[d.getMonth()]+', '+next.time+' · '+(ch.platform==='vk'?'ВК':'Telegram');
  }

        '<section class="card"><div class="card-head"><h3>Вывод</h3><span class="hint">для следующей недели</span></div><p class="sub" style="margin-top:0">'+p.insight+'</p><button class="btn small soft" data-nav="draft">'+icon('spark',13)+' Сделать продолжение</button></section>'+
      '</div>'+
      '<section class="card"><div class="card-head"><h3>Посты</h3><span class="hint">по подпискам</span></div><div class="posts-list">'+
        posts.slice().sort(function(a,b){return b.subs-a.subs;}).map(function(x){
          return '<div class="post-row"><div class="pr-main"><strong>'+x.title+'</strong><div class="pr-meta">'+chTag(x.ch)+'<span>'+x.date+'</span></div></div>'+
          '<div class="pr-stats"><div class="pr-stat"><b>'+fmt(x.views)+'</b><small>просмотры</small></div><div class="pr-stat"><b>'+x.er+'</b><small>ER</small></div><div class="pr-stat"><b>+'+x.subs+(x.est?'<span class="est">оценка</span>':'')+'</b><small>подписки</small></div><div class="pr-stat"><b>'+x.visits+'</b><small>переходы</small></div></div></div>';
        }).join('')+
      '</div></section>';
  }

  /* ---------- placements ---------- */
  function screenPlacements(){
    const p=cur();
    return '<div class="page-head"><div><span class="eyebrow">'+p.name+'</span><h1>Площадки для рекламы</h1><p class="sub">Куда поставить рекламу поста: сообщества ВК под задачу, с охватом, ценой и CPM.</p></div>'+
      '<div class="head-actions"><button class="btn ghost" data-nav="analytics">Вернуться в аналитику</button></div></div>'+
      '<div class="place-banner"><div><strong>Лучший пост недели — '+p.promote.title+'</strong><p>'+p.promote.text+'</p></div><button class="btn primary" data-action="promote">'+icon('send',15)+' Продвинуть пост</button></div>'+
      '<section class="card"><div class="search-row"><input class="input" value="'+p.placements.query.replace(/"/g,'&quot;')+'"><button class="btn primary" data-action="search">'+icon('search',15)+' Подобрать</button></div>'+
      '<div class="card-head" style="margin-top:6px"><h3>Найдено 12 сообществ</h3><span class="hint">3 в шортлисте</span></div>'+
      '<table><thead><tr><th>Сообщество</th><th class="num-cell">Подписчики</th><th class="num-cell">Средний охват</th><th class="num-cell">CPM</th><th class="num-cell">Размещение</th><th></th></tr></thead><tbody>'+
      p.placements.rows.map(function(r){
        return '<tr><td><strong>'+r[0]+'</strong></td><td class="num-cell">'+fmt(r[1])+'</td><td class="num-cell">'+fmt(r[2])+'</td><td class="num-cell cp">'+r[3]+'</td><td class="num-cell">'+r[4]+'</td><td class="num-cell"><button class="btn small ghost" data-action="shortlist">В шортлист</button></td></tr>';
      }).join('')+'</tbody></table></section>';
  }

  /* ---------- settings ---------- */
  function screenSettings(){
    const p=cur();
    return '<div class="page-head"><div><span class="eyebrow">'+p.name+'</span><h1>Настройки проекта</h1><p class="sub">Каналы, конкуренты, дизайн-код и правила генерации. Всё, что делает контент вашим.</p></div>'+
      '<div class="head-actions"><button class="btn primary" data-action="save-settings">Сохранить</button></div></div>'+
      '<div class="settings-grid">'+
        '<section class="card"><div class="card-head"><h3>Каналы</h3><span class="hint">публикация</span></div>'+
          p.channels.map(function(c){ return '<div class="set-row"><div class="l"><strong>'+c.name+'</strong><small>'+c.handle+' · '+fmt(c.subs)+' подписчиков</small></div><span class="ok">подключён</span></div>'; }).join('')+
          '<div class="set-row"><div class="l"><strong>Добавить канал</strong><small>ВК-сообщество или Telegram-канал</small></div><button class="btn small ghost" data-action="add-channel">'+icon('plus',13)+'</button></div>'+
        '</section>'+
        '<section class="card"><div class="card-head"><h3>Конкуренты</h3><span class="hint">источники идей</span></div>'+
          '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">'+p.competitors.map(function(c){ return '<span class="chip-filter active">'+c.name+'</span>'; }).join('')+'</div>'+
          '<p class="hint" style="margin:0;font-size:11px;color:var(--muted)">ВК читается через wall.get, Telegram — через существующий клиент публичных каналов. Посты старше 30 дней не берём.</p>'+
        '</section>'+
        '<section class="card"><div class="card-head"><h3>Дизайн-код</h3><span class="hint">brand kit</span></div>'+
          '<div class="swatches"><span class="sw" style="background:'+p.color+'"></span><span class="sw" style="background:'+p.soft+'"></span><span class="sw" style="background:#20332f"></span><span class="sw" style="background:#f6f3ea"></span></div>'+
          '<div class="brand-line">Шрифт: Inter · заголовки 28/1.1, текст 15/1.5<br>Логотип: слева вверху, отступ 24 px<br>Шаблоны: «карусель 4 слайда», «обложка-цитата», «чек-лист»</div>'+
          '<button class="btn small ghost" style="margin-top:10px" data-action="edit-brand">Редактировать</button>'+
        '</section>'+
        '<section class="card"><div class="card-head"><h3>Правила генерации</h3><span class="hint">для ИИ</span></div>'+
          '<textarea class="input" style="min-height:120px;font-size:12px">'+p.rules+'</textarea>'+
          '<p class="hint" style="margin:8px 0 0;font-size:10.5px;color:var(--muted)">Правила применяются к каждой генерации. Изменения версионируются.</p>'+
        '</section>'+
        '<section class="card"><div class="card-head"><h3>Провайдер</h3><span class="hint">генерация</span></div>'+
          '<select class="select" id="settings-provider"><option>ChatGPT · gpt-5 (через прокси)</option><option>DeepSeek · chat (фолбэк)</option></select>'+
          '<div class="quota"><span>Лимит на проект</span><span>30 генераций / сутки</span></div><div class="bar"><i style="width:23%"></i></div>'+
          '<p class="hint" style="margin:8px 0 0;font-size:10.5px;color:var(--muted)">Если ChatGPT недоступен, запрос уходит в DeepSeek. Квота общая на проект.</p>'+
        '</section>'+
        '<section class="card"><div class="card-head"><h3>Доступ</h3><span class="hint">пока только я</span></div>'+
          '<div class="set-row"><div class="l"><strong>Открыть проект другим</strong><small>Бета для 5–10 владельцев каналов</small></div><span class="warn">выключено</span></div>'+
          '<div class="set-row"><div class="l"><strong>Роль</strong><small>Владелец</small></div><span class="muted">Александр</span></div>'+
        '</section>'+
      '</div>';
  }

  /* ---------- drawer ---------- */
  function openItemDrawer(id){
    const p=cur();
    const item=p.plan.find(function(i){return i.id===id;});
    if(!item) return;
    const c=chById(item.ch);
    const stats = item.metrics ? '<div class="drawer-stats"><div><b>'+fmt(item.metrics.views)+'</b><small>просмотры</small></div><div><b>+'+item.metrics.subs+'</b><small>подписки</small></div><div><b>'+item.metrics.er+'</b><small>ER</small></div></div>' : '';
    const actions = item.status==='published'
      ? '<button class="btn ghost" data-action="close-drawer">Закрыть</button>'
      : item.status==='idea'
        ? '<button class="btn primary" data-to-draft="'+item.id+'">'+icon('pen',15)+' В черновик</button><button class="btn ghost" data-action="close-drawer">Закрыть</button>'
        : '<button class="btn primary" data-publish="'+item.id+'">'+icon('send',15)+' Опубликовать</button><button class="btn ghost" data-to-draft="'+item.id+'">'+icon('pen',15)+' Открыть черновик</button>';
    openDrawer('<div class="drawer-head">'+statusPill(item.status)+'<button class="icon-btn" data-action="close-drawer">'+icon('x',15)+'</button></div>'+
      '<h2>'+item.title+'</h2>'+
      '<div class="meta">'+chTag(item.ch)+'<span>'+item.time+'</span><span>'+new Date(item.date+'T00:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long'})+'</span></div>'+
      stats+
      '<p class="drawer-text">'+item.text+'</p>'+
      '<div class="meta" style="margin-bottom:12px"><span>Источник:</span><strong style="color:#4e5d55">'+item.src+'</strong></div>'+
      '<div class="drawer-actions">'+actions+'</div>');
  }
  function openDayDrawer(dateStr){
    const items=planChips(dateStr);
    const d=parseIso(dateStr);
    openDrawer('<div class="drawer-head"><span class="pill st-idea">'+d.getDate()+' '+MONTHS_GEN[d.getMonth()]+'</span><button class="icon-btn" data-action="close-drawer">'+icon('x',15)+'</button></div>'+
      '<h2>Публикации дня</h2>'+
      (items.length? '<div class="feed" style="margin-top:10px">'+items.map(function(i){ const c=chById(i.ch); return '<button class="feed-item" style="text-align:left;width:100%" data-item="'+i.id+'"><div class="feed-main"><div class="feed-meta">'+platTag(c.platform)+'<span>'+i.time+'</span>'+statusPill(i.status)+'</div><strong style="font-size:13px">'+i.title+'</strong></div></button>'; }).join('')+'</div>' : '<p class="sub">На этот день ничего не запланировано.</p>')+
      '<button class="btn primary" style="width:100%;margin-top:14px" data-action="schedule-day" data-date="'+dateStr+'">'+icon('plus',15)+' Запланировать пост</button>');
  }

  /* ---------- modal ---------- */
  function openSchedule(dateStr){
    const p=cur();
    const d=state.draft[state.project];
    const next=p.plan.filter(function(i){return i.status==='scheduled' && i.ch===d.channel;}).sort(function(a,b){return (a.date+a.time).localeCompare(b.date+b.time);})[0];
    const date = dateStr || (next ? next.date : '2026-11-19');
    const time = next ? next.time : '10:00';
    openModal('<h2>Запланировать публикацию</h2><p>Пост появится в календаре и уйдёт в выбранный канал.</p>'+
      '<form id="schedule-form">'+
      '<div class="field"><label>Канал</label><select class="select" name="ch">'+p.channels.map(function(c){ return '<option value="'+c.id+'" '+(c.id===d.channel?'selected':'')+'>'+c.name+'</option>'; }).join('')+'</select></div>'+
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="field"><label>Дата</label><input class="input" type="date" name="date" value="'+date+'"></div><div class="field"><label>Время</label><input class="input" type="time" name="time" value="'+time+'"></div></div>'+
      '<div class="field"><label>Заголовок</label><input class="input" name="title" value="'+d.title.replace(/"/g,'&quot;')+'"></div>'+
      '<div class="modal-actions"><button type="button" class="btn ghost" data-action="close-modal">Отмена</button><button type="submit" class="btn primary">Запланировать</button></div></form>');
  }

  /* ---------- render ---------- */
  function render(){
    renderSidebar();
    const screens={overview:screenOverview, plan:screenPlan, competitors:screenCompetitors, ideas:screenIdeas, draft:screenDraft, analytics:screenAnalytics, placements:screenPlacements, settings:screenSettings};
    document.getElementById('view').innerHTML = (screens[state.screen]||screenOverview)();
    if(state.screen==='draft') syncPreview();
  }

  function syncPreview(){
    const d=state.draft[state.project];
    const titleEl=document.getElementById('draft-title');
    const bodyEl=document.getElementById('draft-body');
    if(titleEl) d.title=titleEl.value;
    if(bodyEl) d.body=bodyEl.value;
    const short = d.body.split('\n')[0].slice(0,120) + (d.body.length>120?'…':'');
    document.querySelectorAll('[data-preview-body]').forEach(function(el){ el.textContent=short; });
    document.querySelectorAll('[data-cover]').forEach(function(el){ el.textContent=d.title; });
  }

  /* ---------- events ---------- */
  document.addEventListener('click', function(e){
    if(state.projectMenu && !e.target.closest('.project-wrap')){
      state.projectMenu=false;
      renderSidebar();
    }
    const nav=e.target.closest('[data-nav]');
    if(nav){ e.preventDefault(); go(nav.getAttribute('data-nav')); return; }
    const proj=e.target.closest('[data-project]');
    if(proj){ state.project=proj.getAttribute('data-project'); state.projectMenu=false; state.channelFilter='all'; state.afilter='all'; state.ideasTab='new'; render(); showToast('Проект: '+cur().name); return; }
    const toggle=e.target.closest('[data-action="toggle-project"]');
    if(toggle){ state.projectMenu=!state.projectMenu; renderSidebar(); return; }
    if(e.target.closest('[data-action="close-project"]')){ state.projectMenu=false; renderSidebar(); return; }

    const cal=e.target.closest('[data-cal]');
    if(cal){
      const a=cal.getAttribute('data-cal');
      if(a==='prev'){ if(state.calView==='week') state.weekStart=new Date(state.weekStart.getFullYear(),state.weekStart.getMonth(),state.weekStart.getDate()-7); else state.month=new Date(state.month.getFullYear(),state.month.getMonth()-1,1); }
      if(a==='next'){ if(state.calView==='week') state.weekStart=new Date(state.weekStart.getFullYear(),state.weekStart.getMonth(),state.weekStart.getDate()+7); else state.month=new Date(state.month.getFullYear(),state.month.getMonth()+1,1); }
      if(a==='today'){ state.month=new Date(2026,10,1); state.weekStart=new Date(2026,10,16); }
      render(); return;
    }
    const cv=e.target.closest('[data-calview]');
    if(cv){ state.calView=cv.getAttribute('data-calview'); render(); return; }
    const chf=e.target.closest('[data-channel]');
    if(chf){ state.channelFilter=chf.getAttribute('data-channel'); render(); return; }
    const af=e.target.closest('[data-afilter]');
    if(af){ state.afilter=af.getAttribute('data-afilter'); render(); return; }
    const tab=e.target.closest('[data-tab]');
    if(tab){ state.ideasTab=tab.getAttribute('data-tab'); render(); return; }

    const chip=e.target.closest('[data-item]');
    if(chip){ openItemDrawer(chip.getAttribute('data-item')); return; }
    const day=e.target.closest('[data-day]');
    if(day){ openDayDrawer(day.getAttribute('data-day')); return; }

    if(e.target.closest('[data-action="close-drawer"]')){ closeDrawer(); return; }
    if(e.target.closest('[data-action="close-modal"]')){ closeModal(); return; }

    const pub=e.target.closest('[data-publish]');
    if(pub){
      const id=pub.getAttribute('data-publish');
      const item=cur().plan.find(function(i){return i.id===id;});
      if(item){ item.status='published'; item.metrics=item.metrics||{views:0,subs:0,er:'—'}; }
      closeDrawer(); render(); showToast('Пост отмечен как опубликованный · в демо без реальной отправки'); return;
    }
    const toDraft=e.target.closest('[data-to-draft]');
    if(toDraft){
      const item=cur().plan.find(function(i){return i.id===toDraft.getAttribute('data-to-draft');});
      if(item){ state.draft[state.project]={title:item.title, body:item.text+'\n\n(черновик открыт из календаря — допишите текст)', channel:item.ch, provider:'chatgpt'}; }
      closeDrawer(); go('draft'); showToast('Черновик открыт'); return;
    }
    const take=e.target.closest('[data-take]');
    if(take){
      const f=cur().feed.find(function(x){return x.id===take.getAttribute('data-take');});
      if(f){
        cur().ideas.unshift({id:'n'+Date.now(), title:f.idea.title, status:'new', source:f.comp, mult:f.mult, angle:f.idea.angle, why:f.idea.why, checks:'Проверить факты перед публикацией'});
        render(); showToast('Идея добавлена: '+f.idea.title);
      }
      return;
    }
    const ideaDraft=e.target.closest('[data-idea-draft]');
    if(ideaDraft){
      const i=cur().ideas.find(function(x){return x.id===ideaDraft.getAttribute('data-idea-draft');});
      if(i){ i.status='work'; state.draft[state.project]={title:i.title, body:'Крючок: '+i.angle+'\n\n1. …\n\n2. …\n\n3. …\n\nВывод: …\n\nВопрос к читателю: …', channel:cur().channels[0].id, provider:'chatgpt'}; }
      go('draft'); showToast('Черновик создан из идеи'); return;
    }
    const ideaReject=e.target.closest('[data-idea-reject]');
    if(ideaReject){
      const i=cur().ideas.find(function(x){return x.id===ideaReject.getAttribute('data-idea-reject');});
      if(i) i.status='rejected';
      render(); showToast('Идея отклонена'); return;
    }
    const draftCh=e.target.closest('[data-draft-ch]');
    if(draftCh){ state.draft[state.project].channel=draftCh.getAttribute('data-draft-ch'); render(); return; }

    const act=e.target.closest('[data-action]');
    if(act){
      const a=act.getAttribute('data-action');
      if(a==='new-post'){ state.draft[state.project]={title:'Новый пост', body:'', channel:cur().channels[0].id, provider:'chatgpt'}; go('draft'); return; }
      if(a==='generate'){
        const d=state.draft[state.project];
        act.disabled=true; act.innerHTML='Генерирую…';
        const ta=document.getElementById('draft-body');
        if(ta) ta.value='Генерирую через '+(d.provider==='chatgpt'?'ChatGPT':'DeepSeek')+'…';
        setTimeout(function(){
          const body = state.project==='mp'
            ? 'Таблица — это про контроль. Конверты — про решение, принятое заранее.\n\nМы перестали вести бюджет в таблице и попробовали 4 конверта: обязательное, бытовое, радость и подушка. Через 30 дней оказалось, что дело не в приложении, а в том, что деньги разложены до того, как вы их потратите.\n\nЧто дало больше всего:\n• «радость» перестала быть запретом;\n• подушка пополнялась сама, без силы воли;\n• в конце месяца не было вопроса «куда ушло».\n\nПопробуйте неделю: разложите одну зарплату на 4 конверта и напишите, что оказалось сложнее всего.'
            : 'Просмотры отвечают на вопрос «увидели ли», подписки — «остались ли».\n\nВ ВК подписки по посту отдаются напрямую: partnerStats.getContentStatsAllTime возвращает subscriptions, group_visits и link_clicks. В Telegram такой цифры нет — считаем оценку по дельте подписчиков в окне 24 часа.\n\nЧто важно: подписка — это результат поста и канала одновременно. Сравнивайте посты внутри одного канала, а не между площадками.';
          if(ta){ ta.value=body; ta.dispatchEvent(new Event('input',{bubbles:true})); }
          act.disabled=false; act.innerHTML=icon('spark',15)+' Сгенерировать заново';
          showToast('Черновик готов — проверьте факты перед публикацией');
        }, 900);
        return;
      }
      if(a==='schedule'){ openSchedule(); return; }
      if(a==='schedule-day'){ openSchedule(act.getAttribute('data-date')); closeDrawer(); return; }
      if(a==='publish-now'){ showToast('В демо публикация не выполняется'); return; }
      if(a==='save-draft'||a==='save-settings'||a==='edit-brand'){ showToast('Сохранено (демо)'); return; }
      if(a==='scan'){ showToast('В демо новые идеи не подбираются'); return; }
      if(a==='add-competitor'||a==='add-channel'||a==='shortlist'||a==='promote'||a==='search'){ showToast('Демо: действие без реального запроса'); return; }
    }
    if(e.target.closest('#provider-select, #settings-provider')) return;
  });

  document.addEventListener('change', function(e){
    if(e.target.id==='provider-select'){
      const d=state.draft[state.project];
      d.provider=e.target.value;
      const hint=document.getElementById('provider-hint');
      if(hint) hint.textContent=d.provider==='chatgpt'?'ChatGPT · gpt-5':'DeepSeek · chat';
      showToast('Провайдер: '+(d.provider==='chatgpt'?'ChatGPT':'DeepSeek'));
    }
  });

  document.addEventListener('input', function(e){
    if(e.target.id==='draft-title' || e.target.id==='draft-body'){
      const d=state.draft[state.project];
      if(e.target.id==='draft-title') d.title=e.target.value; else d.body=e.target.value;
      syncPreview();
    }
  });

  document.addEventListener('submit', function(e){
    if(e.target.id==='schedule-form'){
      e.preventDefault();
      const f=new FormData(e.target);
      const item={id:'n'+Date.now(), date:f.get('date'), time:f.get('time'), ch:f.get('ch'), title:f.get('title'), status:'scheduled', src:'Черновик', text:state.draft[state.project].body || 'Текст черновика.', metrics:null};
      cur().plan.push(item);
      closeModal();
      state.month=parseIso(item.date); state.month.setDate(1);
      go('plan');
      showToast('Запланировано: '+item.title);
    }
  });

  window.addEventListener('hashchange', function(){
    const h=location.hash.replace('#','');
    if(TITLES[h] && h!==state.screen){ state.screen=h; render(); }
  });

  /* init */
  (function(){
    const qp=new URLSearchParams(location.search);
    if(qp.get('project')==='socstat') state.project='socstat';
    if(qp.get('view')==='week') state.calView='week';
    const start=location.hash.replace('#','');
    if(TITLES[start]) state.screen=start;
    render();
    setTimeout(function(){
      if(state.screen==='draft') syncPreview();
      if(qp.get('item')) openItemDrawer(qp.get('item'));
      if(qp.get('schedule')) openSchedule();
    }, 120);
  })();
</script>
</body>
</html>
